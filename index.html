<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokedex des espèces</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#14130f;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--txt:#ece8df;--mut:#a39d90;--acc:#d97757;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
h1{font:400 26px var(--serif);margin:0}
.stats{display:flex;gap:18px;color:var(--mut);font-size:12px}
.stats b{display:block;color:var(--txt);font:400 20px var(--serif)}
button,select,input,textarea{font:inherit;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
textarea{width:100%;resize:vertical}
option{background:#1d1b16}
button{cursor:pointer}button:hover{filter:brightness(1.2)}
button.pri{background:var(--acc);border-color:var(--acc);color:#2b1208;font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 22px}.bar input{flex:1;min-width:160px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:6px 22px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;backdrop-filter:blur(8px)}
.card:hover{border-color:var(--acc)}
.ph{height:150px;background:#26241e center/cover;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.cb{padding:10px 12px}.no{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.nm{font:400 17px var(--serif)}.la{font-style:italic;color:var(--acc);font-size:13px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:500}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:28px 12px;z-index:9}
#ov.on{display:flex}
#md{background:#1d1b16;border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:20px}
#md h2{font:400 24px var(--serif);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:140px}
.lab{font-size:12px;color:var(--mut);margin-top:10px}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:10px;white-space:pre-line}
.res{padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}.res:hover{border-color:var(--acc)}
.ths{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{height:80px;background:#26241e center/cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.th.on{border-color:var(--acc)}
.big{height:280px;background:#26241e center/cover;border-radius:10px}
.cr{font-size:11px;color:var(--mut)}
#md{max-width:860px}
.fxs h3{font:400 20px var(--serif);border-bottom:1px solid var(--line);padding-bottom:4px;margin:24px 0 8px}
.fxp{white-space:pre-line;margin:2px 0 10px}
.fxtx{border-collapse:collapse;width:100%}
.fxtx td{padding:4px 8px;border-bottom:1px solid var(--line)}
.fxtx td:first-child{color:var(--mut);width:150px}
.fxn{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fxn button{padding:3px 12px;border-radius:99px;font-size:13px}
.dk{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9)}
#fx_map{height:340px;border-radius:10px;overflow:hidden;background:#0f0e0b}
.fxid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.fxid div{background:#1d1b16;padding:8px 12px}
.fxid small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.fxn button.all{border-color:var(--acc);color:var(--acc)}
.fxd{border-bottom:1px solid var(--line)}
.fxd summary{cursor:pointer;list-style:none;font:400 19px var(--serif);padding:12px 2px;display:flex;justify-content:space-between;align-items:center}
.fxd summary::-webkit-details-marker{display:none}
.fxd summary::after{content:"+";color:var(--acc);font:400 22px var(--serif)}
.fxd[open] summary::after{content:"–"}
.fxb{padding:0 2px 14px}
#fx_map{height:460px}
.fxid:empty{display:none}
.fxfil{font-size:13px;color:var(--mut);margin:8px 0 0}
.fxct{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--mut);margin:8px 0}
.fxct label{display:flex;gap:6px;align-items:center;cursor:pointer}
.fxct input{padding:0;background:none;border:0;accent-color:var(--acc)}
.fxct select{padding:3px 8px;font-size:12px}
.leaflet-tooltip{background:#1d1b16;color:#ece8df;border:1px solid #45413b}
.fx2h{font-size:12px;color:var(--mut);margin:2px 0 6px}
#md .lab select{max-width:100%;margin-left:6px;padding:2px 6px;font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.fxct button{padding:3px 10px;font-size:12px}
.leaflet-container .leaflet-interactive:focus,.leaflet-container path:focus,.leaflet-container svg:focus{outline:none}
.leaflet-container{background:#14130f}
.lg{opacity:.45}.lg.on{opacity:1;color:var(--acc)}
#lang{padding:6px 10px}
.res{display:flex;gap:12px;align-items:center}
.res img,.res .rph{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#26241e;flex:none}
.fxlg{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.fxlg i{display:inline-block;width:90px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(217,119,87,.2),rgba(217,119,87,.85))}
.fxhero{position:relative;margin:-20px -20px 8px;border-radius:14px 14px 0 0;overflow:hidden;background:#14130f;display:flex;justify-content:center;align-items:center;padding:22px 0;min-height:220px}
.fxbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.5) saturate(1.3)}
.fxph{position:relative;display:block;max-width:calc(100% - 44px);max-height:460px;width:auto;height:auto;border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
#grid .ph{height:180px;background-position:50% 35%}
.fbrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:6px 0}
.fbf{position:relative;display:inline-block;max-width:100%;cursor:crosshair;border-radius:8px;overflow:hidden;line-height:0}
.fbf img{max-width:100%;max-height:300px;display:block}
.fbf i{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #d97757;pointer-events:none}
.fbpv{width:210px;height:180px;border-radius:12px;background-size:cover;border:1px solid var(--line)}
.fxfr{color:var(--mut);font-style:italic}
.fxfrb{display:inline-block;font-style:normal;font-size:10px;letter-spacing:.06em;padding:0 6px;border-radius:99px;border:1px solid var(--line);color:var(--mut);vertical-align:1px}
/* contour des pays plus net : les petits pays et les iles restent visibles de loin */
.leaflet-pays-pane path{stroke:#fff;stroke-opacity:.7;stroke-width:1.6px;vector-effect:non-scaling-stroke}
/* ---- Observations : liste et boutons ---- */
.fxo{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.fxo span{flex:1;white-space:pre-line}
.fxob{padding:2px 10px;font-size:12px}
.fxo-add{margin:2px 0 8px}
/* ---- Carte du lieu (formulaire d'observation) ---- */
#fx_pm{height:260px;border-radius:10px;overflow:hidden;background:#0f0e0b;margin:4px 0}
.fxpin{width:14px;height:14px;border-radius:50%;background:#22d3ee;border:2px solid #0b0a08;box-shadow:0 0 0 1px rgba(255,255,255,.8)}
/* ---- Recherche de lieu (suggestions) ---- */
.fxps{position:relative;margin:4px 0}
.fxps input{width:100%}
#fx_psl{position:absolute;left:0;right:0;top:100%;z-index:1100;background:#1d1b16;border:1px solid var(--line);border-radius:8px;max-height:250px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#fx_psl>div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
#fx_psl>div:hover{background:rgba(255,255,255,.08)}
#fx_psl small{display:block;color:var(--mut);font-size:11px}
/* ---- Arbre du vivant dans la fiche ---- */
.fxar-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.fxar-bar button{padding:3px 12px;font-size:13px}
.fxar-st{font-size:13px;color:var(--mut);margin:0 0 8px}
.fxar-st b{color:var(--txt)}
.fxar-f{display:block;width:100%;height:clamp(520px,calc(100vh - 90px),1040px);border:1px solid var(--line);border-radius:10px;background:#0b0c10}
#fx_arov{position:fixed;inset:0;z-index:2000;background:#0b0c10}
#fx_arov iframe{display:block;width:100%;height:100%;border:0}
#fx_arx{position:absolute;top:10px;right:10px;z-index:2;width:42px;height:42px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:rgba(26,29,38,.88);border:1px solid var(--line);backdrop-filter:blur(8px)}
@media (max-width:700px){.fxar-f{height:min(70vh,520px)}}
/* Carte globale */
#fx_gm{position:fixed;inset:0;z-index:1500;background:#0b0a08;display:none}
#fx_gm.on{display:block}
#fx_gmap{position:absolute;inset:0;background:#0f0e0b}
#fx_gpan{position:absolute;top:12px;left:12px;z-index:1000;width:min(310px,calc(100vw - 84px));max-height:calc(100% - 24px);overflow:auto;padding:12px 14px;border-radius:14px;background:rgba(29,27,22,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:13px}
#fx_gpan summary{cursor:pointer;font:400 19px var(--serif);list-style:none}
#fx_gpan summary::-webkit-details-marker{display:none}
#fx_gpan input#fx_gq{width:100%;margin:10px 0 6px}
.fxg-f{display:flex;gap:8px;align-items:center;color:var(--mut);margin:6px 0 4px}
.fxg-r{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.fxg-r input{width:auto;padding:0;background:none;border:0;accent-color:var(--acc);flex:none}
.fxg-r b{margin-left:auto;font-weight:500;color:var(--mut)}
.fxg-d{width:12px;height:12px;border-radius:50%;border:1.5px solid #0b0a08;flex:none}
.fxg-b{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fxg-b button{padding:4px 10px;font-size:12px}
.fxg-s{margin-top:8px;font-size:12px;color:var(--mut)}
#fx_gx{position:absolute;top:12px;right:12px;z-index:1000;width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;line-height:1;background:rgba(29,27,22,.85);backdrop-filter:blur(8px);border:1px solid var(--line)}
#fx_gm .leaflet-popup-content-wrapper,#fx_gm .leaflet-popup-tip{background:#1d1b16;color:#ece8df}
#fx_gm .leaflet-popup-content a{color:var(--acc)}
</style></head><body>

</header>

<div id="grid"></div>
<div id="ov" onclick="if(event.target===this)closeAll()"><div id="md"></div></div>

<script>
/* Pokedex des especes : version CONSOLIDEE v3 du 18 oct. 2026. Les correctifs successifs ont ete integres au code (plus de chaine de patchs). */
/* SOMMAIRE (une section = un sujet ; chercher « N. » pour y aller)
   1. BASE : constantes, etat, utilitaires
   2. LANGUE COURANTE
   3. CHAMPS DES FICHES
   4. IMPORT : constantes (sections reconnues, UICN, poissons)
   5. RECHERCHE : constantes
   6. SOURCES DE TEXTE : Wikipedia, GBIF, FishBase, Wikidata, extraction, langue
   7. TRADUCTION DE L'INTERFACE (FR / EN)
   8. TEXTES : detection de l'anglais et affichage d'un bloc
   9. GRILLE : chargement, cartes, rendu, cadrage de la photo
   10. FICHE : ouverture, bandeau photo, navigation
   11. ARBRE DU VIVANT : cadre integre dans la fiche
   12. CARTE : fonds communs (FX_FONDS), zoom continu, cadrage monde, carte de la fiche (pays colores par nombre d'observations GBIF, observations perso)
   13. MODIFIER : formulaire, version anglaise, point focal, outils, enregistrement
   14. OBSERVATIONS : date, pays, carte du lieu, recherche de lieu, ajout / modification / suppression
   15. CONNEXION ET SUPPRESSION
   16. AJOUT D'UNE ESPECE : recherche, import multi-sources, enregistrement
   17. CARTE GLOBALE : toutes les observations, couleurs par grand groupe, filtres
   18. DEMARRAGE
*/
/* ================================================================== */
/* 1. BASE : constantes, etat, utilitaires */
const URL_SB="https://buirnfstagzltzronlmu.supabase.co";
const KEY_SB="sb_publishable_4BocyaiyWs-4Qwa3rKX8Hg_xb_QiIgC";
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const UC={LC:"#60c659",NT:"#cce226",VU:"#f9e814",EN:"#fc7f3f",CR:"#d81e05",EW:"#542344",EX:"#000",DD:"#d1d1c6",NE:"#fff"};
const UF={LC:"Préoccupation mineure",NT:"Quasi menacée",VU:"Vulnérable",EN:"En danger",CR:"En danger critique",EW:"Éteinte à l'état sauvage",EX:"Éteinte",DD:"Données insuffisantes",NE:"Non évaluée"};
let SB=null,ESP=[],OBS={},SES=null,RES=[],CAND=null;
const pill=u=>u?`<span class="pill" title="${esc(UF[u])}" style="background:${UC[u]};color:${u==="EW"||u==="EX"?"#fff":"#111"}">${u}</span>`:"";
const modal=h=>{$("#md").innerHTML=h;$("#ov").classList.add("on")};
function closeAll(){$("#ov").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});

/* ================================================================== */
/* 2. LANGUE COURANTE */
var LANG=(function(){try{return localStorage.getItem("pk_lang")==="en"?"en":"fr"}catch(x){return"fr"}})();
function T2(a,b){return LANG==="en"?b:a}

/* ================================================================== */
/* 3. CHAMPS DES FICHES */
const FX_CH=[["biologie","Description",5],["morphologie","Morphologie",4],["comportement","Comportement",3],["alimentation","Alimentation",3],["reproduction","Reproduction",3],["habitat","Habitat",3],["repartition","Répartition",3],["migration","Migration",3],["ecologie","Rôle écologique",2]];
const FX_TXR=[["Règne","regne"],["Embranchement","phylum"],["Classe","classe"],["Ordre","ordre"],["Famille","famille"],["Genre","genre"]];
const FX_ID=[["taille","Taille"],["poids","Poids"],["longevite","Longévité"],["ponte","Ponte / portée"],["regime","Régime"]];
const C5MK="\u2063FR\u2063";
const C5N="(\\d{1,3}(?:[\\s\\u00a0\\u202f.,]\\d{3})+|\\d+(?:[.,]\\d+)?)";

/* ================================================================== */
/* 4. IMPORT : constantes (sections reconnues, UICN, poissons) */
const FX2_MIN=120;
const FX2_FISH=["Actinopterygii","Elasmobranchii","Chondrichthyes","Holocephali","Petromyzonti","Myxini","Cephalaspidomorphi","Sarcopterygii","Actinopteri","Teleostei","Osteichthyes"];   /* GBIF recent n'a plus de rang "classe" pour les poissons : noms intermediaires acceptes */
const FX2_CAT={
 morphologie:/(morpholog|description|appearance|anatomy|anatomie|physical|caract[eé]ristiques)/i,
 comportement:/(comportement|[eé]thologie|m[oœ]eurs|behaviou?r|vie sociale|social)/i,
 alimentation:/(alimentation|r[eé]gime|nourriture|diet|feeding|food)/i,
 reproduction:/(reproduction|breeding|spawning|life[ -]?cycle|life history|nidification|cycle de vie|frai|ponte)/i,
 habitat:/(habitat|milieu|biotope)/i,
 repartition:/(r[eé]partition|distribution|geographic range|native range|introduced range)/i,
 migration:/(migrat|d[eé]placement|movement)/i,
 ecologie:/([eé]cologi|ecological)/i
};
const FX2G=[[/habitat/i,"habitat"],[/distribut|range/i,"repartition"],[/diet|feeding|food/i,"alimentation"],[/reproduc|breeding|life ?cycle/i,"reproduction"],[/migrat/i,"migration"],[/behaviou?r|biolog/i,"comportement"],[/morpholog|diagnos|appearance/i,"morphologie"],[/general|descript/i,"biologie"]];
const FX2_WDU={Q211005:"LC",Q719675:"NT",Q278113:"VU",Q11394:"EN",Q219127:"CR",Q239509:"EW",Q237350:"EX",Q3245245:"DD",Q3350324:"NE"};
let FX2C={},FX2I={};

/* ================================================================== */
/* 5. RECHERCHE : constantes */
const FX_IC={Aves:"Oiseau",Mammalia:"Mammifère",Reptilia:"Reptile",Amphibia:"Amphibien",Actinopterygii:"Poisson",Mollusca:"Mollusque",Arachnida:"Arachnide",Insecta:"Insecte",Animalia:"Animal"};
const FX_NOTANIM=["Plantae","Fungi","Protozoa","Chromista","Bacteria","Archaea"];
var FXWT={};

/* ================================================================== */
/* 6. SOURCES DE TEXTE : Wikipedia, GBIF, FishBase, Wikidata, extraction, langue */
async function fxWiki(lang,name){
 const d=await getJ("https://"+lang+".wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&format=json&origin=*&titles="+encodeURIComponent(name));
 const pg=d&&d.query&&d.query.pages,p=pg&&Object.values(pg)[0];
 const r=p&&p.missing===undefined&&p.extract?{title:p.title,text:p.extract}:null;
 if(r){if(lang==="fr")FXWT.fr=r.title;if(lang==="en")FXWT.en=r.title}  /* titres retenus pour le nom commun */
 return r;
}
function fxSecs(t){
 const p=t.split(/^(={2,6})\s*(.+?)\s*\1\s*$/m),S={lead:(p[0]||"").trim(),secs:[]};
 for(let i=1;i+2<p.length;i+=3)S.secs.push({title:p[i+1].trim(),text:(p[i+2]||"").trim()});
 return S;
}
async function fxFish(sp){
 const e=(sp.canonicalName||"").split(" ")[1];if(!sp.genus||!e)return null;
 const d=await getJ("https://fishbase.ropensci.org/species?Genus="+encodeURIComponent(sp.genus)+"&Species="+encodeURIComponent(e));
 return d&&d.data&&d.data[0]||null;
}
function fxWdU(d){
 const E=d&&d.entities,e=E&&Object.values(E)[0],c=e&&e.claims&&e.claims.P141;if(!c)return null;
 for(const x of c){const id=x.mainsnak&&x.mainsnak.datavalue&&x.mainsnak.datavalue.value&&x.mainsnak.datavalue.value.id;if(FX2_WDU[id])return FX2_WDU[id]}
 return null;
}
function fxExtr(T){
 const NUM=C5N,RNG=NUM+"(?:\\s?(?:à|-|–|to)\\s?"+NUM+")?";
 const o={},rx=(a,b)=>T.match(new RegExp(a+RNG+b,"i"));
 const cl=v=>String(v).replace(/[\s\u00a0\u202f]+/g," ");
 const rg=m=>cl(m[1])+(m[2]?"–"+cl(m[2]):"");
 let m=rx("(?:longueur|taille|mesure|long de|length|measures)[^.\\n]{0,60}?","\\s?(cm|mm|m)\\b");if(m)o.taille=rg(m)+" "+m[3];
 m=rx("(?:poids|pèse|pesant|masse|weigh(?:s|ing)?|mass)[^.\\n]{0,60}?","\\s?(g|kg)\\b");if(m)o.poids=rg(m)+" "+m[3];
 m=rx("(?:long[ée]vit[ée]|esp[ée]rance de vie|dur[ée]e de vie|vit jusqu|lifespan|life expectancy|live[sd]? (?:up )?to)[^.\\n]{0,60}?","\\s?(ans|years?)\\b");if(m)o.longevite=rg(m)+" ans";
 m=rx("(?:ponte|pond|clutch|portée|litter)[^.\\n]{0,50}?","\\s?(œufs|oeufs|eggs|petits|jeunes|young)")||T.match(new RegExp(RNG+"\\s?(œufs|oeufs|eggs)","i"));
 if(m)o.ponte=rg(m)+" "+m[3].replace("oeufs","œufs");
 m=T.match(/\b(piscivore|insectivore|carnivore|herbivore|omnivore|granivore|frugivore|nectarivore|planctonophage|d[ée]tritivore|piscivorous|insectivorous|carnivorous|herbivorous|omnivorous|granivorous|frugivorous|nectarivorous)s?\b/i);
 if(m)o.regime=m[1].toLowerCase();
 return o;
}
function fxLg(t){
 t=String(t||"");
 const f=(t.match(/\b(le|la|les|des|du|est|sont|une|dans|avec|pour|sur|par|qui|que|ses|elle|il|au|aux|et|ce|se|sa|son|ont|pas|plus|comme|mais|ou|leur|leurs|cette|ces)\b/gi)||[]).length;
 const n=(t.match(/\b(the|of|and|is|are|was|were|with|its|from|which|that|for|this|has|have|it|to|an|by|at|be|or|their|they|can|also|than|these|those|when|where|into|but|not)\b/gi)||[]).length;
 if(f>n)return"fr";
 if(f===n&&/[éèêàùçôîûœï]/i.test(t))return"fr";
 return"en";
}
function fxLgC(c){
 if(/Wikipédia fr/.test(c.src))return"fr";

}
/* ===== PATCH TEXTES-TRI ===== */
/* Choix de texte par defaut : (1) on ECARTE les listes de noms, bibliographies et pages d'homonymie ;
   (2) ordre : francais d'abord, puis Wikipedia (fr ou en) avant les autres sources, puis les textes assez longs
   (FX2_MIN) du plus court au plus long, puis les textes courts. Le premier de la liste est pris par defaut. */
function fxPoubelle(t){
 t=String(t||"");
 if(/(peut (?:d[ée]signer|se r[ée]f[ée]rer)|may refer to|can refer to|homonymie|disambiguation)/i.test(t.slice(0,300)))return true;
 const W=t.split(/\s+/).filter(x=>/[A-Za-zÀ-ÿ]/.test(x));
 const refs=(t.match(/\b(?:et al\b|pp?\.\s?\d|doi\b|isbn|issn|vol\.|bull\.|proc\.|https?:)/gi)||[]).length;
 if(refs>=2)return true;
 if(W.length<15)return false;
 const fw=(t.match(/\b(?:le|la|les|des|du|est|sont|une|dans|avec|pour|sur|par|qui|que|ses|elle|il|au|aux|et|ce|se|sa|son|ont|pas|plus|comme|mais|ou|leur|leurs|cette|ces|the|of|and|is|are|was|were|with|its|from|which|that|for|this|has|have|it|to|an|by|at|be|or|their|they|can|also|than|these|those|when|where|into|but|not)\b/gi)||[]).length;
 const ratio=fw/W.length;
 const cap=W.filter(x=>/^[A-ZÀ-Þ]/.test(x)).length/W.length;
 const ans=(t.match(/\b(?:1[5-9]\d\d|20[0-2]\d)\b/g)||[]).length;
 const py=(t.match(/\(\s?(?:1[5-9]\d\d|20[0-2]\d)\s?\)/g)||[]).length;   /* annees entre parentheses : citations */
 return py>=3||(ans>=3&&ratio<0.25)||(cap>0.3&&ratio<0.15)||ratio<0.03;
}
function fxOrd(a){
 const R=c=>fxLgC(c)==="fr"?0:1;
 const S=c=>/Wikipédia (?:fr|en)/.test(c.src)?0:1;
 const K=c=>c.txt.length>=FX2_MIN?0:1;
 return a.filter(c=>!fxPoubelle(c.txt)).sort((x,y)=>R(x)-R(y)||S(x)-S(y)||K(x)-K(y)||(K(x)?y.txt.length-x.txt.length:x.txt.length-y.txt.length));
}
/* ===== FIN PATCH TEXTES-TRI ===== */

/* ---- Fiche d'identite en anglais (conversion a l'affichage) ---- */
/* Fiche d'identite en anglais : quand une valeur n'a pas de version anglaise saisie, on convertit les formes courantes
   (oeufs -> eggs, ans -> years, virgule decimale -> point, regimes...). Affichage seulement : rien n'est modifie en base.
   Les valeurs inhabituelles restent en francais : saisis-les dans « Version anglaise » (Modifier). */
const FXID_MOTS=[
 ["œufs?|oeufs?",x=>/s$/i.test(x)?"eggs":"egg"],["petits|jeunes","young"],["portées?",x=>/s$/i.test(x)?"litters":"litter"],
 ["ans?",x=>/s$/i.test(x)?"years":"year"],["mois","months"],["jours?",x=>/s$/i.test(x)?"days":"day"],["semaines?",x=>/s$/i.test(x)?"weeks":"week"],
 ["(?:carnivore|herbivore|omnivore|insectivore|piscivore|granivore|frugivore|nectarivore)s?",x=>x.replace(/s$/i,"").replace(/e$/i,"")+"ous"],
 ["planctonophages?","planktivorous"],["d[ée]tritivores?","detritivorous"],["environ","about"],["env\\.","approx."]
];
function fxIdEn(k,v){
 let s=String(v);
 s=s.replace(/(\d),(?!\d{3}(?!\d))(\d)/g,"$1.$2");                       /* virgule decimale -> point (1,5 -> 1.5) ; 1,500 reste */
 s=s.replace(/(\d)[ \u00a0\u202f](?=\d{3}(?!\d))/g,"$1,");                /* milliers : 20 000 -> 20,000 */
 s=s.replace(/(\d)\s*à\s*(\d)/g,"$1 to $2");                              /* 6 à 7 -> 6 to 7 */
 FXID_MOTS.forEach(m=>{
  s=s.replace(new RegExp("(^|[^A-Za-zÀ-ÿŒœ])("+m[0]+")(?![A-Za-zÀ-ÿŒœ])","gi"),(t,p,x)=>{
   let r=typeof m[1]==="function"?m[1](x):m[1];
   if(/^[A-ZÀ-Ý]/.test(x))r=r.charAt(0).toUpperCase()+r.slice(1);
   return p+r;
  });
 });
 return s;
}

/* 8. TEXTES : detection de l'anglais et affichage d'un bloc */
const EN_MIN_CAR=60;   /* sous cette longueur, on ne devine pas la langue */
const EN_MIN_MOTS=4;   /* nombre minimal de mots anglais courants pour conclure */
const EN_RX=/\b(the|of|and|is|are|was|were|with|its|from|which|that|for|this|has|have|it|to|an|by|at|be|or|their|they|can|also|than|these|those|when|where|into|but|not)\b/gi;
const FR_RX=/\b(le|la|les|des|du|est|sont|une|dans|avec|pour|sur|par|qui|que|ses|elle|il|au|aux|et|ce|se|sa|son|ont|pas|plus|comme|mais|ou|leur|leurs|cette|ces)\b/gi;
function estEn(t){
 t=String(t||"");if(t.length<EN_MIN_CAR)return false;
 const n=(t.match(EN_RX)||[]).length,f=(t.match(FR_RX)||[]).length;
 return n>=EN_MIN_MOTS&&n>2*f;
}
/* Bloc de texte d'une fiche. Marques : C5MK = texte francais de repli affiche en vue EN (pastille FR) ;
   texte anglais en vue FR = italique grise + pastille EN. Un texte anglais range dans le champ francais s'affiche normalement en vue EN. */
function fxBloc(t,v){
 if(!v)return "";
 let s=String(v),fr=false;
 if(s.indexOf(C5MK)===0){fr=true;s=s.slice(C5MK.length)}
 const lab=t?'<div class="lab">'+esc(t)+'</div>':'';
 if(estEn(s)){
  if(LANG!=="en")return lab+'<div class="fxp fxfr" title="Texte en anglais (pas de version française)"><span class="fxfrb">EN</span> '+esc(s)+'</div>';
  fr=false;
 }
 return lab+'<div class="fxp'+(fr?' fxfr':'')+'">'+(fr?'<span class="fxfrb">FR</span> ':'')+esc(s)+'</div>';
}

/* --- Taxonomie : completer classe / ordre / famille manquants (libelle de groupe vide sur la carte) ---
   GBIF n'a pas de rang "classe" pour les poissons : on cherche dans sa lignee (/parents), puis dans iNaturalist.
   Lance a chaque chargement ; ecrit en base si connecte ; les echecs sont memorises pour la session (FXRX). */
async function fxClasseInat(name){
 const st=await getJ("https://api.inaturalist.org/v1/taxa?q="+encodeURIComponent(name)+"&per_page=5");
 const t=st&&(st.results||[]).find(x=>x.name===name);
 if(!t)return null;
 const dt=await getJ("https://api.inaturalist.org/v1/taxa/"+t.id);
 const tx=dt&&dt.results&&dt.results[0];
 const a=tx&&(tx.ancestors||[]).find(x=>x.rank==="class");
 return a?a.name:(t.iconic_taxon_name==="Actinopterygii"?"Actinopterygii":null);
}
async function fxRepTaxo(){
 if(window.FXRT)return;window.FXRT=1;
 try{
  window.FXRX=window.FXRX||{};
  const nm=x=>x&&(x.canonicalName||x.scientificName);
  const L0=ESP.filter(e=>e.gbif_key&&!e.classe&&!window.FXRX[e.gbif_key]);
  let n=0;
  for(const e of L0){
   const d=await getJ("https://api.gbif.org/v1/species/"+e.gbif_key);
   const pa=await getJ("https://api.gbif.org/v1/species/"+e.gbif_key+"/parents");
   let cl=d&&d.class;
   if(!cl&&Array.isArray(pa)){const p=pa.find(x=>x.rank==="CLASS")||pa.find(x=>FX2_FISH.indexOf(nm(x))>=0);cl=nm(p)}
   if(!cl)cl=await fxClasseInat(e.nom_latin);
   if(!cl)cl=fxClasseDeOrdre(e.ordre||(d&&d.order));   /* dernier recours : deduire la classe de l'ordre */
   if(!cl){window.FXRX[e.gbif_key]=1;console.warn("[taxo] aucune classe trouvee pour",e.nom_latin,"| ancetres :",Array.isArray(pa)?pa.map(x=>x.rank+":"+nm(x)).join(" > "):"?");continue}
   const ch={classe:cl};
   if(d){if(!e.regne&&d.kingdom)ch.regne=d.kingdom;if(!e.phylum&&d.phylum)ch.phylum=d.phylum;if(!e.ordre&&d.order)ch.ordre=d.order;if(!e.famille&&d.family)ch.famille=d.family;if(!e.genre&&d.genus)ch.genre=d.genus}
   Object.assign(e,ch);n++;
   if(SES){const r=await SB.from("especes").update(ch).eq("id",e.id).select("id");
    if(r.error)console.warn("[taxo] ecriture refusee",e.nom_latin,r.error.message);
    else if(!r.data||!r.data.length)console.warn("[taxo] AUCUNE ligne modifiee pour",e.nom_latin,"(droits Supabase ?)");
    else console.log("[taxo] enregistre en base :",e.nom_latin,"->",cl)}
  }
  if(n)render();
 }catch(x){console.warn("[taxo]",x)}
 window.FXRT=0;
}
async function load(){
 const a=await SB.from("especes").select("*").order("numero");
 const b=await SB.from("observations").select("*").order("date_obs",{ascending:false});
 const er=a.error||b.error;
 if(er){$("#grid").innerHTML=`<p style="padding:22px;color:#e88">Erreur Supabase : ${esc(er.message)}</p>`;return}
 ESP=a.data;OBS={};setTimeout(fxRepTaxo,0);
 b.data.forEach(o=>{(OBS[o.espece_id]=OBS[o.espece_id]||[]).push(o)});

/* --- Cadrage "monde" commun aux trois cartes (fiche, formulaire d'observation, carte globale) ---
   Le monde REMPLIT la fenetre (aucune bande) et n'est jamais repete (noWrap + maxBounds). Le zoom minimum est exact : les cartes ont zoomSnap:0
   (avec 0.25 Leaflet arrondissait au quart superieur : monde rogne a droite, Nouvelle-Zelande hors cadre). */
function fxHautCarte(w){return Math.max(280,Math.min(Math.round(w*0.6),Math.round(window.innerHeight*0.6)))}
function fxZMonde(m,WB){const so=m.options.zoomSnap;m.setMinZoom(0);m.options.zoomSnap=0;const z=m.getBoundsZoom(WB,true);m.options.zoomSnap=so;return isFinite(z)?z:m.getBoundsZoom(WB,false)}
/* centre de la vue monde : bande -52 / 84 de latitude ; si la fenetre est trop basse on rogne l'Arctique et on garde la Nouvelle-Zelande */
function fxCentreMonde(m){const z=m.getMinZoom(),s=m.getSize(),pb=m.project(L.latLng(-52,0),z),pt=m.project(L.latLng(84,0),z);return m.unproject(L.point(pb.x,Math.max(pb.y-s.y/2,(pt.y+pb.y)/2)),z)}
/* --- Fonds de carte (Esri) et zoom continu, communs aux trois cartes (fiche, formulaire d'observation, carte globale) ---
   n = zoom natif maximal des tuiles (au-dela, Leaflet agrandit). r = couche de noms (villes, frontieres). */
const FX_ES="https://server.arcgisonline.com/ArcGIS/rest/services/";
const FX_FONDS={
 dark:{fr:"Sombre",en:"Dark",n:16,u:FX_ES+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",r:FX_ES+"Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"},
 ocean:{fr:"Océans",en:"Oceans",n:10,u:FX_ES+"Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",r:FX_ES+"Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}"},
 relief:{fr:"Relief",en:"Relief",n:10,u:FX_ES+"World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}"},
 sat:{fr:"Satellite",en:"Satellite",n:16,u:FX_ES+"World_Imagery/MapServer/tile/{z}/{y}/{x}"},
 hyb:{fr:"Satellite + noms",en:"Satellite + labels",n:16,u:FX_ES+"World_Imagery/MapServer/tile/{z}/{y}/{x}",r:FX_ES+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"},

};
function fxFondsOptions(sel){return Object.keys(FX_FONDS).map(k=>'<option value="'+k+'"'+(k===sel?" selected":"")+'>'+T2(FX_FONDS[k].fr,FX_FONDS[k].en)+'</option>').join("")}
/* Renvoie la fonction set(cle) qui change le fond de la carte m. Haute definition (retina) ; couche de secours floue (zoom <= 3, quelques dizaines de tuiles)
   toujours chargee sous la couche detaillee : floue au lieu de noire pendant le zoom. */
function fxFondsInit(m){
 let cur=null,curR=null,und=null,fb=false;
 if(!m.getPane("ref")){m.createPane("ref").style.zIndex=425;m.getPane("ref").style.pointerEvents="none"}
 return k=>{
  if(cur)m.removeLayer(cur);if(curR)m.removeLayer(curR);if(und){m.removeLayer(und);und=null}
  const b=FX_FONDS[k];
  und=L.tileLayer(b.u,{noWrap:true,maxZoom:16,maxNativeZoom:3,zIndex:1}).addTo(m);
  cur=L.tileLayer(b.u,{attribution:"Tiles © Esri",noWrap:true,detectRetina:true,maxZoom:16,maxNativeZoom:b.n,zIndex:2,keepBuffer:4});
  cur.on("tileerror",()=>{if(fb)return;fb=true;m.removeLayer(cur);cur=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",className:k==="dark"?"dk":"",noWrap:true,maxZoom:19}).addTo(m);cur.bringToBack()});
  cur.addTo(m);cur.bringToBack();
  und.setZIndex(-5);   /* bringToBack() met cur sous la couche de secours : on remet cette derniere tout en bas */
  curR=b.r?L.tileLayer(b.r,{noWrap:true,detectRetina:true,maxZoom:16,maxNativeZoom:b.n,pane:"ref"}).addTo(m):null;
 };
}
/* Zoom continu : le pincement du pave tactile arrive comme "molette + Ctrl". On cumule le mouvement et on l'applique par pas lisses, centre sur le curseur.
   molette() (facultatif) dit si la molette SIMPLE doit zoomer (sinon la page defile) ; le pincement zoome toujours. Les boutons + / - de Leaflet restent disponibles. */
const FX_ZOOM={pincement:0.03,souris:0.01,deuxDoigts:0.018,pasMax:0.5};   /* sensibilite ; pasMax = niveaux de zoom max par image (les tuiles ont le temps de suivre) */
function fxZoomContinu(m,el,molette){
 const S={acc:0,pt:null,raf:0};
 const pas=()=>{
  S.raf=0;
  const st=Math.max(-FX_ZOOM.pasMax,Math.min(FX_ZOOM.pasMax,S.acc));S.acc-=st;
  const z=Math.max(m.getMinZoom(),Math.min(m.getMaxZoom(),m.getZoom()+st));
  try{m.setZoomAround(S.pt,z,{animate:false})}catch(x){}
  if(Math.abs(S.acc)>0.01)S.raf=requestAnimationFrame(pas);else S.acc=0;
 };
 el.addEventListener("wheel",ev=>{
  if(!ev.ctrlKey&&molette&&!molette())return;
  ev.preventDefault();ev.stopPropagation();
  const dy=ev.deltaY*(ev.deltaMode===1?33:(ev.deltaMode===2?400:1));
  const k=ev.ctrlKey?FX_ZOOM.pincement:(Math.abs(dy)>=50?FX_ZOOM.souris:FX_ZOOM.deuxDoigts);   /* pincement / molette de souris / deux doigts */
  S.acc+=-dy*k;S.pt=m.mouseEventToContainerPoint(ev);
  if(!S.raf)S.raf=requestAnimationFrame(pas);
 },{passive:false,capture:true});
}

 if(!window.L){el.innerHTML='<p style="padding:14px;color:#e88">'+T2("Carte indisponible (Leaflet non chargé).","Map unavailable (Leaflet not loaded).")+'</p>';return}

 const ZMAX_OBS=6,SEUIL_PROCHE=2000;   /* zoom max / distance (m) en dessous de laquelle on centre sur un point */
 const OUVERTURE_MONDE=true;           /* true : la carte s'ouvre sur le monde entier ; false : cadree sur tes observations */
 const ptsV=(ob||[]).filter(o=>o&&o.lat!=null&&o.lon!=null&&isFinite(+o.lat)&&isFinite(+o.lon));
 const m=L.map(el,{minZoom:0,maxZoom:14,zoomSnap:0,zoomDelta:1,keyboard:false}).setView([20,10],1);
 window.FXM=m;window.FXF=null;
 [["pays",410],["dens",420],["ref",425],["obs",430]].forEach(a=>{m.createPane(a[0]).style.zIndex=a[1]});
 m.getPane("ref").style.pointerEvents="none";
 const setBM=fxFondsInit(m);

/* Modifier : en ouvrant la fiche, on relance la collecte des textes (Wikipedia fr et en, GBIF) et on ajoute, a cote de chaque
   rubrique (francais ET anglais), un menu pour CHOISIR un texte parmi les sources. Le choix remplit la zone de texte ;
   rien n'est enregistre avant « Enregistrer ». La source du champ est mise a jour a l'enregistrement si le texte n'a pas ete retouche. */
var FXMDC={fr:{},en:{}},FXMDCH={id:null,fr:{},en:{}};
function fxCollectTextes(wf,we,gd){
 const C={};
 const add=(f,src,label,txt)=>{txt=String(txt||"").replace(/\n{3,}/g,"\n\n").trim();if(txt.length>30)(C[f]=C[f]||[]).push({src:src,label:label,txt:txt})};
 [["fr",wf],["en",we]].forEach(a=>{
  const w=a[1];if(!w)return;
  const S=fxSecs(w.text),src="Wikipédia "+a[0]+" (CC BY-SA)",lb="Wikipédia "+a[0]+" « "+w.title+" »";
  add("biologie",src,lb,S.lead);
  S.secs.forEach(sc=>Object.keys(FX2_CAT).forEach(f=>{if(FX2_CAT[f].test(sc.title))add(f,src,lb,sc.text)}));
 });
 ((gd&&gd.results)||[]).filter(r=>/^(eng|fra|en|fr)/i.test(r.language||"")).forEach(r=>{
  const g=FX2G.find(x=>x[0].test(r.type||""));
  if(g)add(g[1],"GBIF","GBIF"+(r.source?" ("+String(r.source).slice(0,40)+")":""),String(r.description||"").replace(/<[^>]+>/g," ").replace(/\s+/g," "));
 });
 const FXC={};Object.keys(C).forEach(f=>{const seen=new Set();FXC[f]=fxOrd(C[f].filter(c=>!seen.has(c.txt)&&seen.add(c.txt)))});
 return FXC;
}

   });
  });
  st(n?"Sources : "+[["Wikipédia fr",wf],["Wikipédia en",we],["GBIF",gd&&gd.results]].map(x=>x[0]+" "+(x[1]?"✓":"✗")).join(" · ")+". Choisis un texte dans le menu d'une rubrique : il remplace la zone (rien n'est enregistré avant « Enregistrer »).":"Aucune source de texte trouvée.");

/* 14. OBSERVATIONS : date, pays, carte du lieu, recherche de lieu, ajout / modification / suppression */
/* ---- Dates avec precision (jour / mois / annee) ---- */
/* Dates d'observation avec precision : jour, mois ou annee (colonne observations.date_prec). Le tri reste correct :
   une date partielle est stockee au 1er du mois ou au 1er janvier. */
const FX_MOIS={fr:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],
 en:["January","February","March","April","May","June","July","August","September","October","November","December"]};
function fxDateTxt(d,prec){
 const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||""));if(!m)return "";
 const y=m[1],mo=+m[2],jr=+m[3],M=FX_MOIS[LANG==="en"?"en":"fr"];
 if(prec==="annee")return y;
 if(prec==="mois")return M[mo-1]+" "+y;
 return LANG==="en"?M[mo-1]+" "+jr+", "+y:jr+(jr===1?"er ":" ")+M[mo-1]+" "+y;
}
function fxDateFields(){
 const M=FX_MOIS[LANG==="en"?"en":"fr"];
 return '<div class="row"><input id="f_oy" type="number" min="1900" max="2100" placeholder="'+T2("Année (ex. 2019)","Year (e.g. 2019)")+'">'+
  '<select id="f_om"><option value="">'+T2("Mois (si connu)","Month (if known)")+'</option>'+M.map((n,i)=>'<option value="'+(i+1)+'">'+n+'</option>').join("")+'</select>'+
  '<input id="f_od" type="number" min="1" max="31" placeholder="'+T2("Jour (si connu)","Day (if known)")+'"></div>'+
  '<div class="cr">'+T2("Laisse le mois et le jour vides si tu ne les connais pas : la date sera enregistrée comme « année » ou « mois ».","Leave month and day empty if unknown: the date is saved as “year” or “month”.")+'</div>';
}
function fxObsDate(){
 const v=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
 const y=v("f_oy"),mo=v("f_om"),jr=v("f_od");
 if(!y&&!mo&&!jr)return{date:null,prec:"jour"};
 if(!/^\d{4}$/.test(y)||+y<1900||+y>2100)return{err:"Année invalide : 4 chiffres, entre 1900 et 2100 (ex. 2019)."};
 if(!mo&&jr)return{err:"Un jour est saisi sans mois : choisis le mois ou efface le jour."};
 if(!mo)return{date:y+"-01-01",prec:"annee"};
 const mm=String(mo).padStart(2,"0");
 if(!jr)return{date:y+"-"+mm+"-01",prec:"mois"};
 const J=+jr,d=new Date(Date.UTC(+y,+mo-1,J));
 if(!(J>=1)||d.getUTCMonth()!==+mo-1)return{err:"Ce jour n'existe pas pour ce mois."};
 return{date:y+"-"+mm+"-"+String(J).padStart(2,"0"),prec:"jour"};
}

const FX_ISO=("AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ "+
 "CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR "+
 "GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP "+
 "KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ "+
 "NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW "+
 "SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ "+

const FX_PN={};
function fxPaysNom(c,lang){
 lang=lang||(LANG==="en"?"en":"fr");
 if(!(lang in FX_PN)){try{FX_PN[lang]=new Intl.DisplayNames([lang],{type:"region"})}catch(x){FX_PN[lang]=null}}

function fxObsLigne(o){

function fxObsAdmin(ob,espId){

function fxObsRemplir(o){
 const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v};
 const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(o.date_obs||"");

 if(o.pays_code)set("f_pc",o.pays_code);
 else if(o.pays){set("f_pc","__autre");set("f_pays",o.pays);fxPaysAutre()}

async function saveObs(obsId,espId){
 const od=fxObsDate();if(od.err){alert(od.err);return}

 const g=id=>{const e=document.getElementById(id);return e&&e.value.trim()?e.value.trim():null};

/* ---- Carte pour poser le lieu ---- */
/* Poser le lieu d'une observation sur une carte : clic ou glisser du repere -> remplit latitude / longitude (champs replies). */
function fxPickMapHtml(){
 return '<div class="lab">'+T2("Lieu sur la carte : clique pour poser le point, glisse le repère pour ajuster","Place on the map: click to drop the pin, drag it to adjust")+'</div>'+
  '<div class="fxps"><input id="fx_ps" type="search" autocomplete="off" placeholder="'+T2("Chercher un lieu (ville, lac, parc…)","Search a place (city, lake, park…)")+'"><div id="fx_psl"></div></div><div id="fx_pm"></div>'+
  '<div class="fxct"><label>'+T2("Fond","Base")+' <select id="fx_pmb">'+fxFondsOptions("dark")+'</select></label>'+
  '<span class="cr" id="fx_pmc"></span><button type="button" id="fx_pme">'+T2("Effacer le point","Clear the point")+'</button></div>'+
  '<details class="fxd" style="margin-top:6px"><summary>'+T2("Coordonnées","Coordinates")+'</summary><div class="fxb"><div class="row"><input id="f_lat" placeholder="Latitude (ex. 46.15)"><input id="f_lon" placeholder="Longitude (ex. -1.15)"></div></div></details>';
}
function fxPickMapInit(){
 const el=document.getElementById("fx_pm");if(!el)return;
 if(!window.L){el.innerHTML='<p style="padding:14px;color:#e88">'+T2("Carte indisponible (Leaflet non chargé).","Map unavailable (Leaflet not loaded).")+'</p>';return}
 try{if(window.FXPM)window.FXPM.remove()}catch(x){}
 /* cadrage monde commun (voir fxZMonde) : monde unique, jamais repete */
 const WB=L.latLngBounds([[-58,-180],[84,180]]);
 const m=L.map(el,{minZoom:0,maxZoom:15,zoomSnap:0,zoomDelta:1}).setView([20,10],1);
 const zMonde=()=>fxZMonde(m,WB);
 const calib=()=>{el.style.height=fxHautCarte(el.offsetWidth)+"px";m.invalidateSize();const z=zMonde();m.setMinZoom(z);m.setMaxBounds(WB);return z};
 const vueMonde=()=>{const z=calib();m.setView(WB.getCenter(),z,{animate:false})};
 if(el.offsetWidth>0)vueMonde();
 window.FXPM=m;
 let molette=false;   /* la molette fait defiler la fenetre ; elle zoome seulement apres un clic dans la carte (le pincement zoome toujours) */
 m.scrollWheelZoom.disable();
 m.on("focus",()=>{molette=true});m.on("blur",()=>{molette=false});
 fxZoomContinu(m,el,()=>molette);
 const setBM=fxFondsInit(m);
 setBM("dark");
 const lat=document.getElementById("f_lat"),lon=document.getElementById("f_lon"),info=document.getElementById("fx_pmc");
 let pin=null;
 const dire=()=>{if(info)info.textContent=(lat.value&&lon.value)?lat.value+" ; "+lon.value:T2("Aucun point posé","No point set")};
 const poser=(ll,centrer)=>{
  const w=ll.wrap?ll.wrap():ll,la=+(+w.lat).toFixed(5),lo=+(+w.lng).toFixed(5);
  lat.value=la;lon.value=lo;dire();
  if(pin)pin.setLatLng([la,lo]);
  else{
   pin=L.marker([la,lo],{draggable:true,icon:L.divIcon({className:"",html:'<div class="fxpin"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(m);
   pin.on("dragend",()=>poser(pin.getLatLng()));
  }
  if(centrer)m.setView([la,lo],Math.max(m.getZoom(),8));
 };
 const lire=()=>{const a=parseFloat(String(lat.value).replace(",",".")),o=parseFloat(String(lon.value).replace(",","."));return(isFinite(a)&&isFinite(o)&&Math.abs(a)<=90&&Math.abs(o)<=180)?[a,o]:null};
 m.on("click",ev=>poser(ev.latlng,false));
 window.FXPM_VERS=(la,lo,ext)=>{   /* appelee par la recherche de lieu */
  poser(L.latLng(la,lo),false);
  if(ext&&ext.length===4){try{m.fitBounds([[ext[3],ext[0]],[ext[1],ext[2]]],{maxZoom:14,padding:[20,20]});return}catch(x){}}
  m.setView([la,lo],12);
 };
 const saisie=()=>{const p=lire();if(p)poser(L.latLng(p[0],p[1]),true);else if(info)info.textContent=(lat.value||lon.value)?T2("Coordonnées invalides","Invalid coordinates"):T2("Aucun point posé","No point set")};
 lat.addEventListener("change",saisie);lon.addEventListener("change",saisie);
 document.getElementById("fx_pmb").addEventListener("change",ev=>setBM(ev.target.value));
 document.getElementById("fx_pme").addEventListener("click",()=>{lat.value="";lon.value="";if(pin){m.removeLayer(pin);pin=null}dire()});
 const p0=lire();
 if(p0)poser(L.latLng(p0[0],p0[1]),true);else dire();   /* observation existante : on part de son point */
 setTimeout(()=>{try{if(pin)calib();else vueMonde()}catch(x){}},120);   /* recadrage une fois la fenetre affichee */
 fxLieuInit();
}
/* ---- Recherche de lieu avec suggestions ---- */
/* Recherche de lieu avec suggestions (Photon, fait pour la frappe) ; repli sur le service OpenStreetMap (Nominatim) UNIQUEMENT sur clic :
   sa politique interdit l'autocompletion. Un lieu choisi pose le point sur la carte, remplit « Lieu » et selectionne le pays. */
const FX_LS={cache:{}};
function fxLieuLabel(nom,ville,region){return[nom,ville,region].filter((x,i,t)=>x&&t.indexOf(x)===i).join(", ")}
async function fxLieuPhoton(q){
 const lg=LANG==="en"?"en":"fr";
 const r=await fetch("https://photon.komoot.io/api/?q="+encodeURIComponent(q)+"&limit=6&lang="+lg);
 if(!r.ok)throw new Error("photon "+r.status);
 const d=await r.json();
 return(d.features||[]).filter(f=>f.geometry&&f.geometry.coordinates).map(f=>{
  const p=f.properties||{},c=f.geometry.coordinates,label=fxLieuLabel(p.name||p.street||"",p.city||p.county||p.district||"",p.state||"");
  return{lat:+c[1],lon:+c[0],nom:p.name||p.street||label,label:label,cc:String(p.countrycode||"").toUpperCase(),pays:p.country||"",ext:(p.extent&&p.extent.length===4)?p.extent:null};
 });
}
async function fxLieuNomi(q){
 const lg=LANG==="en"?"en":"fr";
 const r=await fetch("https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(q)+"&format=jsonv2&limit=6&addressdetails=1&accept-language="+lg);
 if(!r.ok)throw new Error("nominatim "+r.status);
 const d=await r.json();
 return(d||[]).map(x=>{
  const a=x.address||{},nom=x.name||String(x.display_name||"").split(",")[0],label=fxLieuLabel(nom,a.city||a.town||a.village||a.municipality||a.county||"",a.state||""),b=x.boundingbox;
  return{lat:+x.lat,lon:+x.lon,nom:nom,label:label,cc:String(a.country_code||"").toUpperCase(),pays:a.country||"",ext:(b&&b.length===4)?[+b[2],+b[1],+b[3],+b[0]]:null};
 });
}
function fxLieuChoisir(r){
 if(!r)return;
 const lieu=document.getElementById("f_lieu");if(lieu)lieu.value=r.label||r.nom;
 const sel=document.getElementById("f_pc");
 if(sel){
  if(r.cc&&FX_ISO.indexOf(r.cc)>=0){sel.value=r.cc;fxPaysAutre()}
  else if(r.pays){sel.value="__autre";fxPaysAutre();const t=document.getElementById("f_pays");if(t)t.value=r.pays}
 }
 if(window.FXPM_VERS)window.FXPM_VERS(r.lat,r.lon,r.ext);
}
function fxLieuInit(){
 const inp=document.getElementById("fx_ps"),box=document.getElementById("fx_psl");if(!inp||!box)return;
 let tmr=null,seq=0,items=[];
 const montrer=h=>{box.innerHTML=h;box.style.display=h?"block":"none"};
 const osm='<div data-nomi="1"><b>'+T2("Chercher avec OpenStreetMap","Search with OpenStreetMap")+'</b><small>'+T2("autre service, sur clic seulement","other service, on click only")+'</small></div>';
 const lancer=async(q,nomi)=>{
  const n=++seq,cle=(nomi?"n:":"p:")+q;
  montrer('<div class="cr" style="padding:7px 10px">'+T2("Recherche…","Searching…")+'</div>');
  let res=FX_LS.cache[cle],err=null;
  if(!res){try{res=await(nomi?fxLieuNomi(q):fxLieuPhoton(q));FX_LS.cache[cle]=res}catch(x){err=x}}
  if(n!==seq)return;                                  /* reponse perimee : une recherche plus recente est partie */
  if(err){montrer('<div class="cr" style="padding:7px 10px">'+T2("Service de recherche indisponible. Pose le point sur la carte.","Search service unavailable. Drop the pin on the map.")+'</div>'+(nomi?"":osm));return}
  items=res;
  if(!res.length){montrer('<div class="cr" style="padding:7px 10px">'+T2("Aucun lieu trouvé. Pose le point sur la carte.","No place found. Drop the pin on the map.")+'</div>'+(nomi?"":osm));return}
  montrer(res.map((r,i)=>'<div data-i="'+i+'">'+esc(r.nom)+'<small>'+esc([r.label,r.pays].filter(Boolean).join(" · "))+'</small></div>').join("")+(nomi?"":osm));
 };
 inp.addEventListener("input",()=>{
  clearTimeout(tmr);const q=inp.value.trim();
  if(q.length<3){seq++;montrer("");return}
  tmr=setTimeout(()=>lancer(q,false),400);            /* attend la fin de la frappe */
 });
 inp.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter")return;
  ev.preventDefault();clearTimeout(tmr);
  const q=inp.value.trim();if(q.length>=2)lancer(q,false);
 });
 box.addEventListener("mousedown",ev=>ev.preventDefault());   /* garde le focus : le clic n'est pas avale par le blur */
 box.addEventListener("click",ev=>{
  const d=ev.target.closest("[data-i],[data-nomi]");if(!d)return;
  if(d.dataset.nomi){const q=inp.value.trim();if(q.length>=2)lancer(q,true);return}
  const r=items[+d.dataset.i];fxLieuChoisir(r);inp.value=r?r.nom:inp.value;montrer("");
 });
 inp.addEventListener("blur",()=>setTimeout(()=>montrer(""),150));
}

   la compare a la fiche et propose les differences, ancien et nouveau COTE A COTE.
   Rien n'est ecrit sans clic sur « Appliquer ». Observations, photo, point focal, taxonomie et nom commun
   ne sont jamais touches. La collecte reprend celle de pickImport (a fusionner a la prochaine consolidation). */
var FXACT=null;   /* propositions en cours : {id, items} */
const FXA_NZ=s=>String(s==null?"":s).replace(/\s+/g," ").trim();
/* Fonction pure : compare la fiche e aux candidats et renvoie la liste des propositions */
function fxActPlan(e,FXC,IDC,u0){
 const items=[],ex=e.extra||{},en=e.en||{},enx=en.x||{};
 const prop=(kind,f,label,old,nw,src,lab)=>{
  if(!FXA_NZ(nw)||FXA_NZ(nw)===FXA_NZ(old))return;
  items.push({kind:kind,f:f,label:label,old:old||"",nw:nw,src:src||"",lab:lab||""});
 };
 FX_CH.forEach(c=>{
  const A=FXC[c[0]]||[];
  const fr=A.find(x=>fxLgC(x)==="fr"),eng=A.find(x=>fxLgC(x)==="en");
  if(fr)prop("fr",c[0],c[1],e[c[0]],fr.txt,fr.src,fr.label);
  if(eng)prop("en",c[0],c[1]+" (EN)",en[c[0]],eng.txt,eng.src,eng.label);
 });
 FX_ID.forEach(r=>{
  const A=IDC[r[0]]||[];
  /* valeur francaise : source fr ou FishBase ; un repli anglais seulement si le champ est vide */
  const F=A.find(a=>/Wikipédia fr|FishBase/.test(a.src))||(FXA_NZ(ex[r[0]])?null:A[0]);
  if(F)prop("idfr",r[0],r[1],ex[r[0]],F.txt,F.src,"");
  const E=A.find(a=>/Wikipédia en|FishBase/.test(a.src));
  if(E)prop("iden",r[0],r[1]+" (EN)",enx[r[0]],String(E.txt).replace(/ ans$/," years"),E.src,"");
 });
 if(u0&&UF[u0])prop("uicn","uicn","Statut UICN",e.uicn,u0,"iNaturalist / Wikidata (UICN, à vérifier)","");
 return items;
}

function fxIdChargerHeic(){

  if(window.heic2any)return ok();
  const sc=document.createElement("script");
  sc.src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";

async function fxIdReduire(file,max){
 try{return await fxIdReduire0(file,max)}catch(e){
  if(!/hei[cf]/i.test((file.type||"")+" "+(file.name||"")))throw e;
  await fxIdChargerHeic();
  let b=await window.heic2any({blob:file,toType:"image/jpeg",quality:0.9});

  return fxIdReduire0(b,max);

}
function fxIdReduire0(file,max){
 return new Promise((ok,ko)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
   const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   URL.revokeObjectURL(u);
   const d=c.toDataURL("image/jpeg",0.85);
   ok({b64:d.split(",")[1],prev:d});
  };
  im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("image"))};
  im.src=u;
 });
}

  const m=await getJ("https://api.gbif.org/v1/species/match?name="+encodeURIComponent(n)+"&kingdom=Animalia");
  const key=m&&m.matchType!=="NONE"&&(m.acceptedUsageKey||m.usageKey);
  if(key){const d=await getJ("https://api.gbif.org/v1/species/"+key);if(ok(d))return d}
  const r=await getJ("https://api.gbif.org/v1/species/search?q="+encodeURIComponent(n)+"&rank=SPECIES&rank=SUBSPECIES&highertaxonKey=1&limit=5");
  const f=r&&(r.results||[]).find(x=>x.canonicalName&&x.canonicalName.toLowerCase()===n.toLowerCase());
  if(f){const k2=f.acceptedKey||f.key;const d=k2===f.key?f:await getJ("https://api.gbif.org/v1/species/"+k2);if(ok(d))return d}
  return null;
 };

 const liste=[name].concat(alts||[]).map(x=>String(x||"").trim()).filter(x=>x&&!vus[x.toLowerCase()]&&(vus[x.toLowerCase()]=1));
 for(const n of liste){const d=await essai(n);if(d)return d}

}

async function fxNoms(sp){
 if(!document.getElementById("f_nom"))return;
 const cap=t=>t?t.charAt(0).toUpperCase()+t.slice(1):"";
 const lat=String(sp.canonicalName||"").toLowerCase(),L2=[];
 const add=(t,s)=>{t=cap(String(t||"").replace(/\s*\(.*?\)\s*$/,"").trim());if(t&&t.toLowerCase()!==lat&&!L2.some(x=>x.t.toLowerCase()===t.toLowerCase()))L2.push({t:t,s:s})};
 add(FXWT.fr,"Wikipédia fr");add(sp._vn,"iNaturalist");
 const v=await getJ("https://api.gbif.org/v1/species/"+sp.key+"/vernacularNames?limit=200");
 ((v&&v.results)||[]).filter(n=>n.language==="fra").forEach(n=>add(n.vernacularName,"GBIF"));
 const inp=document.getElementById("f_nom");if(!inp||!L2.length)return;
 inp.value=L2[0].t;
 if(L2.length>1&&!document.getElementById("f_nomsel"))inp.insertAdjacentHTML("afterend",'<select id="f_nomsel" style="width:100%;margin-top:6px;font-size:12px" onchange="document.getElementById(\'f_nom\').value=this.value">'+L2.map(x=>'<option value="'+esc(x.t)+'">'+esc(x.t)+' · '+x.s+'</option>').join("")+'</select>');
}
function fxEnForm(){
 if(!document.getElementById("f_nom"))return;
 const best=f=>{const A=(FX2C[f]||[]).filter(c=>fxLgC(c)==="en");return A[0]?A[0].txt:""};
 const vals={nom_commun:FXWT.en?FXWT.en.charAt(0).toUpperCase()+FXWT.en.slice(1):""},x={};
 FX_ID.forEach(r=>{const A=(FX2I[r[0]]||[]).filter(a=>/Wikipédia en|FishBase/.test(a.src));if(A[0])x[r[0]]=String(A[0].txt).replace(/ ans$/," years")});
 vals.x=x;
 FX_CH.forEach(c=>{vals[c[0]]=best(c[0])});
 FX_CH.forEach(c=>{const A=FX2C[c[0]]||[],el=document.getElementById("f2_"+c[0]);if(el&&A[0]&&fxLgC(A[0])==="en")el.value=""});
 const S=document.querySelector("#md .sec");
 if(S)S.insertAdjacentHTML("beforebegin",fxEnBlock("f2en_",vals,false,'<div class="cr">Pré-rempli depuis Wikipédia en, à relire. Laisse vide si l\'article anglais n\'existe pas.</div>'));
}
/* ===== PATCH CHOIX-EN ===== */
/* Formulaire d'ajout : un menu deroulant de sources par rubrique de la VERSION ANGLAISE (comme pour le francais).
   On ne propose que les textes reconnus anglais ; le premier est celui deja pre-rempli. */
var FX2EN={};
function fx2SwEn(f,k){const c=(FX2EN[f]||[])[+k],el=document.getElementById("f2en_"+f);if(c&&el)el.value=c.txt}
function fxEnSelects(){
 FX2EN={};
 FX_CH.forEach(c=>{
  const A=(FX2C[c[0]]||[]).filter(x=>fxLgC(x)==="en"),ta=document.getElementById("f2en_"+c[0]),lab=ta&&ta.previousElementSibling;
  if(!lab)return;
  FX2EN[c[0]]=A;
  lab.insertAdjacentHTML("beforeend",A.length>1?'<select onchange="fx2SwEn(\''+c[0]+'\',this.value)">'+A.map((x,k)=>'<option value="'+k+'">'+esc(x.label)+' · '+x.txt.length+' car.</option>').join("")+'</select>':'<span class="cr"> · '+(A[0]?esc(A[0].label):"aucune source anglaise trouvée")+'</span>');
 });
}

async function pick(i){
 const r=RES[i];FXWT={};
 if(r&&r._inat){
  modal('<p class="cr">Recherche de l\'espèce dans GBIF…</p>');
  let sp=await fxResolve(r.name,[r.mt,r.q]);
  if(!sp&&r.id){   /* dernier recours : les noms scientifiques (synonymes) connus d'iNaturalist */
   const t=await getJ("https://api.inaturalist.org/v1/taxa/"+r.id);
   const tn=(t&&t.results&&t.results[0]&&t.results[0].taxon_names)||[];
   sp=await fxResolve("",tn.filter(x=>x.lexicon==="scientific-names").map(x=>x.name));
  }
  if(!sp){modal('<p style="color:#e88">Espèce introuvable dans GBIF ('+esc(r.name)+'). Essaie avec le nom latin.</p><button onclick="openAdd()">Retour</button>');return}
  sp._vn=r.vn;sp._inat=r.name;RES[i]=sp;
 }
 await pickImport(i);
 fxNoms(RES[i]);
 fxEnForm();   /* pre-remplit le bloc anglais */
 fxEnSelects();   /* menus de sources du bloc anglais */
 fxPickMapInit();   /* carte pour poser le lieu */
 fxPhotoTools();    /* plus de photos, lien perso */
}
async function save(){
 const od=fxObsDate();if(od.err){alert(od.err);return}   /* valide la date AVANT toute ecriture */
 const op=fxObsPays();
 const sp=CAND.sp,ph=CAND.photos[CAND.sel]||{};
 const g=id=>{const e=document.getElementById(id);return e&&e.value.trim()?e.value.trim():null};
 const num=id=>{const v=g(id);return v&&!isNaN(+v.replace(",","."))?+v.replace(",","."):null};
 let id=null;
 const ex=await SB.from("especes").select("id").eq("gbif_key",sp.key).maybeSingle();
 if(ex.data)id=ex.data.id;
 if(!id){
  const used=new Set(["GBIF (taxonomie)"]),srcMap={};
  const row={nom_commun:g("f_nom"),nom_latin:sp.canonicalName||sp.scientificName,gbif_key:sp.key,regne:sp.kingdom,phylum:sp.phylum,classe:sp.class,ordre:sp.order,famille:sp.family,genre:sp.genus,uicn:g("f_uicn"),uicn_annee:num("f_an"),photo_url:ph.url||null,photo_auteur:ph.by||null,photo_licence:ph.lic||null,photo_source:ph.src||null,consulte_le:new Date().toISOString().slice(0,10)};
  FX_CH.forEach(c=>{const v=g("f2_"+c[0]);row[c[0]]=v;const m=(FX2C[c[0]]||[]).find(x=>x.txt===v);if(m){used.add(m.src);srcMap[c[0]]=m.label}});
  const ext={src:srcMap};
  FX_ID.forEach(r=>{const v=g("f2_x_"+r[0]);if(v){ext[r[0]]=v;const m=(FX2I[r[0]]||[]).find(x=>x.txt===v);if(m)used.add(m.src)}});
  const en={},enx={},ensrc={};
  const nn=g("f2en_nom_commun");if(nn)en.nom_commun=nn;
  FX_CH.forEach(c=>{const v=g("f2en_"+c[0]);if(v){en[c[0]]=v;const m=(FX2C[c[0]]||[]).find(x=>x.txt===v);if(m){used.add(m.src);ensrc[c[0]]=m.label}}});
  FX_ID.forEach(r=>{const v=g("f2en_x_"+r[0]);if(v)enx[r[0]]=v});
  if(Object.keys(enx).length)en.x=enx;
  if(Object.keys(en).length&&FXWT.en)used.add("Wikipédia en (CC BY-SA)");
  en.src=ensrc;
  if(ph.url)used.add(ph.from||"iNaturalist (photo)");
  if(row.uicn)used.add("iNaturalist / Wikidata (UICN, à vérifier)");
  row.extra=ext;row.en=en;row.sources=[...used].join(" ; ");
  const r=await SB.from("especes").insert(row).select("id").single();
  if(r.error)return alert("Erreur : "+r.error.message);
  id=r.data.id;
 }
 const r2=await SB.from("observations").insert({espece_id:id,date_obs:od.date,date_prec:od.prec,lieu:g("f_lieu"),pays:op.pays,pays_code:op.code,lat:num("f_lat"),lon:num("f_lon"),note:g("f_note")});
 if(r2.error)return alert("Erreur : "+r2.error.message);
 closeAll();load();
}

/* 17. CARTE GLOBALE : toutes les observations, couleurs par grand groupe, filtres */
/* Carte de TOUTES les observations : un point par observation avec coordonnees, couleur par grand groupe (8 couleurs), filtres, satellite par defaut. */
const FXG_GR=[
 ["mam","Mammifères","Mammals","#E69F00"],
 ["ois","Oiseaux","Birds","#F0E442"],
 ["rep","Reptiles","Reptiles","#2ECC9A"],
 ["amp","Amphibiens","Amphibians","#FF6B6B"],
 ["poi","Poissons","Fish","#56B4E9"],
 ["art","Arthropodes (insectes, arachnides, crustacés)","Arthropods (insects, arachnids, crustaceans)","#CC79A7"],
 ["mol","Mollusques","Molluscs","#8E9BFF"],
 ["aut","Autres invertébrés et divers","Other invertebrates and misc.","#B0B0B0"]
];
const FXG_MAP={poissons:"poi",oiseaux:"ois",mammiferes:"mam",reptiles:"rep",amphibiens:"amp",insectes:"art",arachnides:"art",crustaces:"art",mollusques:"mol"};
function fxGroupeCarte(e){return FXG_MAP[fxGroupe(e)]||"aut"}
function fxGlobeClose(){
 const ov=document.getElementById("fx_gm");
 try{if(window.FXGM)window.FXGM.remove()}catch(x){}
 window.FXGM=null;
 if(window.FXGR){window.removeEventListener("resize",window.FXGR);window.FXGR=null}
 if(ov){ov.classList.remove("on");ov.innerHTML=""}
}
function fxGlobeFiche(id){fxGlobeClose();openFiche(id)}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&document.querySelector("#fx_gm.on"))fxGlobeClose()});
function fxGlobe(){
 if(!window.L){alert(T2("Carte indisponible (Leaflet non chargé).","Map unavailable (Leaflet not loaded)."));return}
 fxGlobeClose();
 let ov=document.getElementById("fx_gm");
 if(!ov){ov=document.createElement("div");ov.id="fx_gm";document.body.appendChild(ov)}
 const GN=g=>T2(g[1],g[2]);
 ov.innerHTML=`<div id="fx_gmap"></div>
 <button id="fx_gx" title="Échap">✕</button>
 <div id="fx_gpan"><details id="fx_gd" ${window.innerWidth>700?"open":""}><summary>${T2("Carte de mes observations","Map of my observations")}</summary>
 <input id="fx_gq" placeholder="${T2("Filtrer : nom, famille, ordre…","Filter: name, family, order…")}">
 <label class="fxg-f">${T2("Fond","Base")} <select id="fx_gbm">${fxFondsOptions("sat")}</select></label>
 <div id="fx_gl">${FXG_GR.map(g=>`<label class="fxg-r"><input type="checkbox" checked data-k="${g[0]}"><span class="fxg-d" style="background:${g[3]}"></span><span>${esc(GN(g))}</span><b id="fx_gc_${g[0]}">0</b></label>`).join("")}</div>
 <div class="fxg-b"><button id="fx_gt">${T2("Tout","All")}</button><button id="fx_gn">${T2("Aucun","None")}</button><button id="fx_gw">${T2("Monde","World")}</button><button id="fx_gp">${T2("Centrer sur les points","Zoom to points")}</button></div>
 <div id="fx_gs" class="fxg-s"></div></details></div>`;
 ov.classList.add("on");
 const WB=L.latLngBounds([[-58,-180],[84,180]]);
 const m=L.map("fx_gmap",{minZoom:0,maxZoom:14,zoomSnap:0,zoomDelta:1,zoomControl:false,keyboard:false}).setView([20,10],1);
 window.FXGM=m;
 L.control.zoom({position:"bottomright"}).addTo(m);
 m.createPane("obs").style.zIndex=430;   /* le volet "ref" (noms) est cree par fxFondsInit */
 const setBM=fxFondsInit(m);
 fxZoomContinu(m,document.getElementById("fx_gmap"));   /* le panneau de gauche garde son defilement normal */
 setBM("sat");   /* satellite par defaut */
 const zMonde=()=>fxZMonde(m,WB),cM=()=>fxCentreMonde(m);   /* cadrage monde commun aux trois cartes */
 const vueMonde=()=>{m.invalidateSize();const z=zMonde();m.setMinZoom(z);m.setMaxBounds(WB);m.setView(cM(),z,{animate:false})};
 vueMonde();
 const on={},GRP={},layers={};
 FXG_GR.forEach(g=>{on[g[0]]=true;GRP[g[0]]=g;layers[g[0]]=L.layerGroup().addTo(m)});
 let q="",pts=[];
 const flat=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const draw=()=>{
  FXG_GR.forEach(g=>layers[g[0]].clearLayers());
  const cnt={};let tot=0,vis=0;pts=[];
  ESP.forEach(e=>{
   const k=fxGroupeCarte(e);
   if(q&&flat([e.nom_commun,e.nom_latin,e.genre,e.famille,e.ordre,e.classe].join(" ")).indexOf(q)<0)return;
   (OBS[e.id]||[]).forEach(o=>{
    const la=+o.lat,lo=+o.lon;
    if(o.lat==null||o.lon==null||!isFinite(la)||!isFinite(lo))return;
    cnt[k]=(cnt[k]||0)+1;tot++;
    if(!on[k])return;
    vis++;pts.push([la,lo]);
    const nm=e.nom_commun||e.nom_latin,dt=fxDateTxt(o.date_obs,o.date_prec),pl=[o.lieu,fxPaysLib(o)].filter(Boolean).join(", ");
    L.circleMarker([la,lo],{pane:"obs",radius:5,color:"#0b0a08",weight:1.5,fillColor:GRP[k][3],fillOpacity:.95}).addTo(layers[k])
     .on("mouseover",function(){this.setRadius(8)}).on("mouseout",function(){this.setRadius(5)})
     .bindTooltip(esc(nm),{sticky:true})
     .bindPopup("<b>"+esc(nm)+"</b><br><i>"+esc(e.nom_latin)+"</i>"+((dt||pl)?"<br>"+esc([dt,pl].filter(Boolean).join(" · ")):"")+"<br><a href=\"#\" onclick=\"fxGlobeFiche('"+e.id+"');return false\">"+T2("Voir la fiche","Open the page")+"</a>");
   });
  });
  FXG_GR.forEach(g=>{const c=document.getElementById("fx_gc_"+g[0]);if(c){c.textContent=cnt[g[0]]||0;c.parentNode.style.opacity=cnt[g[0]]?1:.45}});
  const s=document.getElementById("fx_gs");
  if(s)s.textContent=tot?vis+" / "+tot+T2(" observations affichées"," observations shown"):T2("Aucune observation avec coordonnées pour l'instant.","No observation with coordinates yet.");
 };
 draw();
 document.getElementById("fx_gx").onclick=fxGlobeClose;
 document.getElementById("fx_gq").addEventListener("input",ev=>{q=flat(ev.target.value.trim());draw()});
 document.getElementById("fx_gbm").addEventListener("change",ev=>setBM(ev.target.value));
 document.querySelectorAll("#fx_gl input").forEach(c=>c.addEventListener("change",()=>{on[c.dataset.k]=c.checked;draw()}));
 const tous=v=>{FXG_GR.forEach(g=>{on[g[0]]=v});document.querySelectorAll("#fx_gl input").forEach(c=>{c.checked=v});draw()};
 document.getElementById("fx_gt").onclick=()=>tous(true);
 document.getElementById("fx_gn").onclick=()=>tous(false);
 document.getElementById("fx_gw").onclick=vueMonde;
 document.getElementById("fx_gp").onclick=()=>{if(!pts.length)return;if(pts.length===1)m.setView(pts[0],8,{animate:false});else m.fitBounds(L.latLngBounds(pts),{padding:[70,70],maxZoom:8,animate:false})};
 window.FXGR=()=>{try{const au=m.getZoom()<=m.getMinZoom()+0.01;m.invalidateSize();const z=zMonde();m.setMinZoom(z);if(au)m.setView(cM(),z,{animate:false})}catch(x){}};
 window.addEventListener("resize",window.FXGR);
}
